<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice samples</title>
<style>
  :root { --bg: #fbf7ee; --ink: #22303c; --card: #fff; --line: #e6dfd0; --accent: #d9a800; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1b1f24; --ink: #eee; --card: #262b31; --line: #3a4048; } }
  body { margin: 0; padding: 20px 16px 60px; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p.lead { margin: 0 0 20px; opacity: .8; }
  h2 { font-size: 1.15rem; margin: 28px 0 8px; }
  .voice { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 10px 0; }
  .voice h3 { margin: 0 0 6px; font-size: 1rem; }
  .voice .tag { font-size: .8rem; opacity: .7; margin-left: 6px; }
  .line { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px dashed var(--line); }
  .line:first-of-type { border-top: 0; }
  .line span { font-size: .95rem; }
  audio { width: 200px; height: 32px; }
  @media (max-width: 480px) { .line { grid-template-columns: 1fr; } audio { width: 100%; } }
  .pick { position: sticky; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 10px 16px; margin: 20px -16px -60px; }
</style>
</head>
<body>
<h1>Which voice?</h1>
<p class="lead">The same five lines in each voice. "Today" is the voice in the app now. The others are Indic Parler-TTS, free and offline. Play them and tell me the name you like for each language.</p>
<div id="root"></div>
<script>
const LANGS = { en: 'English', hi: 'Hindi', mr: 'Marathi', or: 'Odia' };
const LINES = {
  en: ["This is capital A.", "A for Apple.", "This is a cow. The cow gives us milk.", "This one is big.", "This is a sparrow."],
  hi: ["यह बड़ा A है।", "A से Apple — सेब।", "यह गाय है। गाय हमें दूध देती है।", "यह बड़ा है।", "यह गौरैया है।"],
  mr: ["हे मोठं A आहे.", "A — Apple, म्हणजे सफरचंद.", "ही गाय आहे. गाय आपल्याला दूध देते.", "हा मोठा आहे.", "ही चिमणी आहे."],
  or: ["ଏହା ବଡ଼ A।", "A — Apple, ମାନେ ସେଓ।", "ଏହା ଏକ ଗାଈ। ଗାଈ ଆମକୁ କ୍ଷୀର ଦିଏ।", "ଏହା ବଡ଼।", "ଏହା ଏକ ଘରଚଟିଆ।"],
};
const VOICES = {
  en: [['today', 'Today (Indic-TTS)'], ['Mary', 'Mary'], ['Thoma', 'Thoma']],
  hi: [['today', 'Today (Indic-TTS)'], ['Divya', 'Divya'], ['Rohit', 'Rohit']],
  mr: [['today', 'Today (Indic-TTS)'], ['Sunita', 'Sunita'], ['Sanjay', 'Sanjay']],
  or: [['today', 'Today (Indic-TTS)'], ['Debjani', 'Debjani'], ['Manas', 'Manas']],
};
const root = document.getElementById('root');
for (const [lang, name] of Object.entries(LANGS)) {
  const h = document.createElement('h2'); h.textContent = name; root.appendChild(h);
  for (const [id, label] of VOICES[lang]) {
    const box = document.createElement('div'); box.className = 'voice';
    box.innerHTML = `<h3>${label}<span class="tag">${id === 'today' ? 'current' : 'woman'.replace('woman', ['Mary','Divya','Sunita','Debjani'].includes(id) ? 'woman' : 'man')}</span></h3>`;
    LINES[lang].forEach((text, i) => {
      const row = document.createElement('div'); row.className = 'line';
      row.innerHTML = `<span>${text}</span><audio controls preload="none" src="assets/voice-samples/${lang}-${id}-${i + 1}.mp3"></audio>`;
      box.appendChild(row);
    });
    root.appendChild(box);
  }
}
</script>
</body>
</html>
